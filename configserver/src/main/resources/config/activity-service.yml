spring:
  application:
    name: activity-service
  data:
    mongodb:
      uri: ${ACTIVITY_MONGO_URI:mongodb://localhost:27017/fitnessactivity}
      database: fitnessactivity
      auto-index-creation: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    # Credentials are not set here (Spring defaults to guest/guest for local development).
    # Override with SPRING_RABBITMQ_USERNAME / SPRING_RABBITMQ_PASSWORD in the service's environment.

server:
  port: 8082

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

rabbitmq:
  exchange:
    name: fitness.exchange
  queue:
    name: activity.queue
  routing:
    key: activity.tracking
