server:
  port: 8081

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/fitness_user_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

# Shared HMAC secret used to sign JWTs on register/login.
# Must match api-gateway.yml's jwt.secret exactly - the gateway validates
# tokens signed here.
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000 # 24 hours
