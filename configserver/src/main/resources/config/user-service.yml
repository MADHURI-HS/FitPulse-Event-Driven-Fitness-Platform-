server:
  port: 8081

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/fitness_user_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    # No password here on purpose. The Config Server resolves ${...} placeholders from its own
    # environment and serves the result over HTTP, so a secret written in this file would be
    # readable at /user-service/default. userservice reads SPRING_DATASOURCE_PASSWORD from its
    # own environment instead.
  jpa:
    hibernate:
      ddl-auto: update

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

jwt:
  # jwt.secret is intentionally absent: userservice reads it from its own JWT_SECRET environment
  # variable (it must be identical to the gateway's).
  expiration-ms: 86400000 # 24 hours
