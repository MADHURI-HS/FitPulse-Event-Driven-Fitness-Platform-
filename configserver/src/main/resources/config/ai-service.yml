server:
  port: 8083

spring:
  data:
    mongodb:
      uri: ${AI_MONGO_URI:mongodb://localhost:27017/fitnessrecommendation}
      database: fitnessrecommendation
      auto-index-creation: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    # Credentials are not set here (Spring defaults to guest/guest for local development).
    # Override with SPRING_RABBITMQ_USERNAME / SPRING_RABBITMQ_PASSWORD in the service's environment.
    listener:
      simple:
        # After the retries below are exhausted the message goes to the dead-letter queue (activity.dlq)
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 2s
          multiplier: 2
          max-attempts: 3

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

rabbitmq:
  exchange:
    name: fitness.exchange
  queue:
    name: activity.queue
  routing:
    key: activity.tracking

# gemini.api.url and gemini.api.key are read from the aiservice's own GEMINI_API_URL and
# GEMINI_API_KEY environment variables, never from this file (the Config Server serves its
# files over HTTP). The URL must not contain the key, e.g.
# https://generativelanguage.googleapis.com/v1beta/models/<model>:generateContent
