name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, userservice, activityservice, aiservice]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "23"
          cache: maven
      - name: Run unit tests
        working-directory: ${{ matrix.service }}
        run: chmod +x mvnw && ./mvnw -B test

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fitness-app-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fitness-app-frontend/package-lock.json
      - run: npm ci
      - run: npm run build
